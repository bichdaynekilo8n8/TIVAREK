spring.application.name=tivarek
spring.profiles.default=dev
server.address=127.0.0.1
server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=dbo
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
server.error.include-message=never
server.error.include-stacktrace=never

# Chỉ công khai tình trạng ứng dụng, không tiết lộ chi tiết hệ thống.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Ảnh ngoài classpath/target; đặt đường dẫn tuyệt đối khi dùng thực tế.
tivarek.storage.directory=${TIVAREK_UPLOAD_DIR:./var/device-images}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=55MB

# Week 24 — classpath static assets only; dynamic/customer responses remain no-store.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**,/images/**
spring.web.resources.cache.cachecontrol.max-age=1h
spring.web.resources.cache.cachecontrol.must-revalidate=true
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,text/xml,image/svg+xml
# Leave empty in DEV. Configure a trusted public HTTPS origin when deploying the backend.
tivarek.seo.base-url=${TIVAREK_PUBLIC_BASE_URL:}
