# DATABASE
spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=TIVAREK_DEV;encrypt=true;trustServerCertificate=true

spring.datasource.username=${TIVAREK_DB_USER}
spring.datasource.password=${TIVAREK_DB_PASSWORD}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# THYMELEAF
spring.thymeleaf.cache=false

# DEBUG
logging.level.com.zaxxer.hikari=DEBUG