# Dùng DB thực hành Tuần 8; không trộn với schema products JPA cũ.
spring.datasource.url=${TIVAREK_DB_URL:${DB_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=TIVAREK_WEEK8_DEV;encrypt=true;trustServerCertificate=true}}
spring.datasource.username=${TIVAREK_DB_USER:${DB_USERNAME:tivarek_dev}}
spring.datasource.password=${TIVAREK_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.flyway.locations=classpath:db/migration,classpath:dev/db/migration
spring.thymeleaf.cache=false

# Các chỉ mục mã chuẩn hóa dùng computed column. Áp dụng cho mỗi connection mới.
spring.datasource.hikari.connection-init-sql=SET ANSI_NULLS ON; SET QUOTED_IDENTIFIER ON; SET ANSI_PADDING ON; SET ANSI_WARNINGS ON; SET ARITHABORT ON; SET CONCAT_NULL_YIELDS_NULL ON; SET NUMERIC_ROUNDABORT OFF;
