spring.datasource.url=${TIVAREK_DB_URL}
spring.datasource.username=${TIVAREK_DB_USER}
spring.datasource.password=${TIVAREK_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.thymeleaf.cache=true
tivarek.demo.enabled=false
# Mặc định chỉ lắng nghe loopback: phù hợp với Cloudflare Tunnel trên chính máy chạy app.
# Chỉ đổi sang 0.0.0.0 khi thực sự dùng nền tảng hosting có proxy tin cậy.
server.address=${TIVAREK_BIND_ADDRESS:127.0.0.1}
server.servlet.session.cookie.secure=true
# Chỉ sử dụng khi truy cập qua reverse proxy tin cậy tới loopback.
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.web.resources.cache.period=7d

# Các chỉ mục mã chuẩn hóa dùng computed column. Áp dụng cho mỗi connection mới.
spring.datasource.hikari.connection-init-sql=SET ANSI_NULLS ON; SET QUOTED_IDENTIFIER ON; SET ANSI_PADDING ON; SET ANSI_WARNINGS ON; SET ARITHABORT ON; SET CONCAT_NULL_YIELDS_NULL ON; SET NUMERIC_ROUNDABORT OFF;
