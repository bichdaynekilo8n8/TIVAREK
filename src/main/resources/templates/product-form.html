<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIVAREK — Quản lý sản phẩm</title><link rel="stylesheet" th:href="@{/css/week23.css}">
<link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/week24.css}">
</head><body><a class="w24-skip" href="#main-content">Bỏ qua điều hướng</a><header th:replace="~{catalog-layout :: header}"></header><main id="main-content" tabindex="-1" class="workspace"><nav th:replace="~{catalog-layout :: nav}"></nav><div th:replace="~{catalog-layout :: notices}"></div>
<div class="page-heading"><div><span class="eyebrow">THÔNG TIN SẢN PHẨM</span><h1 th:text="${editId == null ? 'Thêm sản phẩm' : 'Chỉnh sửa sản phẩm'}"></h1><p class="muted">Mỗi SKU đại diện cho một mẫu sản phẩm. Dấu * là thông tin bắt buộc.</p></div><a th:href="@{/admin/products}">← Danh sách sản phẩm</a></div>
<section class="panel"><form class="form-grid" th:object="${input}" th:action="${editId == null} ? @{/admin/products} : @{/admin/products/{id}(id=${editId})}" method="post">
<div class="notice error full" role="alert" th:if="${#fields.hasAnyErrors()}"><strong>Kiểm tra lại thông tin:</strong><ul><li th:each="e:${#fields.allErrors()}" th:text="${e}"></li></ul></div>
<input type="hidden" th:field="*{revision}">
<label>SKU *<input th:field="*{sku}" maxlength="40" pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,39}" placeholder="LAP-DELL-5420" required><small class="muted">Duy nhất; tự chuyển chữ hoa, bỏ khoảng trắng đầu/cuối.</small></label>
<label>Tên mẫu sản phẩm *<input th:field="*{name}" maxlength="180" placeholder="Dell Latitude 5420" required></label>
<label>Danh mục *<select th:field="*{categoryId}" required><option value="">Chọn danh mục</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name + (c.active ? '' : ' (đã ngừng)')}" th:disabled="${!c.active}"></option></select></label>
<label>Thương hiệu<select th:field="*{brandId}"><option value="">Không có / chưa xác định</option><option th:each="b:${brands}" th:value="${b.id}" th:text="${b.name + (b.active ? '' : ' (đã ngừng)')}" th:disabled="${!b.active}"></option></select></label>
<label>Đơn vị tính *<select th:field="*{unitId}" required><option value="">Chọn đơn vị</option><option th:each="u:${units}" th:value="${u.id}" th:text="${u.name + (u.active ? '' : ' (đã ngừng)')}" th:disabled="${!u.active}"></option></select></label>
<label>Loại quản lý *<select th:field="*{stockMode}" th:disabled="${editId != null}" required><option value="SERIALIZED">SERIALIZED — Từng thiết bị</option><option value="BULK">BULK — Theo số lượng</option></select><input th:if="${editId != null}" type="hidden" name="stockMode" th:value="${input.stockMode}"><small class="muted">Cố định sau khi tạo để giữ đúng dữ liệu thiết bị và kho.</small></label>
<label>Giá tham khảo của mẫu (đ) *<input type="number" th:field="*{listPrice}" min="0" step="0.01" max="99999999999999999.99" required><small class="muted">Không phải giá riêng của từng máy; nhập 0 nếu chưa có giá.</small></label>
<label class="full">Mô tả mẫu<textarea th:field="*{description}" maxlength="2000" rows="5" placeholder="Thông tin chung của mẫu sản phẩm; chưa nhập serial hoặc tình trạng từng máy."></textarea></label>
<div class="form-actions"><button class="button" th:text="${editId == null ? 'Thêm sản phẩm' : 'Lưu thay đổi'}"></button><a th:href="@{/admin/products}">Hủy</a><a th:if="${editId != null}" th:href="@{/admin/products/{id}/edit(id=${editId})}">Tải lại dữ liệu mới nhất</a></div></form></section>
</main></body></html>
