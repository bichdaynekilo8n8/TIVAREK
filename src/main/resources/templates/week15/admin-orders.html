<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý đơn bán — TIVAREK</title><link rel="stylesheet" th:href="@{/css/week23.css}">
<link rel="stylesheet" th:href="@{/css/week15.css}"><link rel="stylesheet" th:href="@{/css/week24.css}">
</head><body><a class="w24-skip" href="#main-content">Bỏ qua điều hướng</a>
<header th:replace="~{week15/fragments/nav :: nav}"></header><main id="main-content" tabindex="-1" class="wrap"><h1>Quản lý bán hàng</h1><p class="lead">Đơn web và đơn tại quầy, xác nhận tồn kho, bàn giao, thu tiền, đổi trả.</p>
<div class="actions"><a class="button" th:if="${canCreate}" th:href="@{/admin/orders/new}">Tạo đơn tại quầy</a><a class="button secondary" th:href="@{/admin}">Bảng quản trị</a><a class="button secondary" th:href="@{/admin/stock}">Kho hàng</a></div>
<section class="box"><form class="actions" method="get" th:action="@{/admin/orders}"><label>Lọc trạng thái<select name="status"><option value="ALL" th:selected="${status == 'ALL'}">Tất cả</option><option value="DRAFT" th:selected="${status == 'DRAFT'}">Chờ xác nhận</option><option value="CONFIRMED" th:selected="${status == 'CONFIRMED'}">Đã xác nhận</option><option value="FULFILLING" th:selected="${status == 'FULFILLING'}">Đang giao/thu tiền</option><option value="COMPLETED" th:selected="${status == 'COMPLETED'}">Hoàn tất</option><option value="CANCELLED" th:selected="${status == 'CANCELLED'}">Đã hủy</option></select></label><button type="submit">Lọc</button></form>
<div class="table-scroll"><table><thead><tr><th>Đơn</th><th>Khách hàng</th><th>Kênh</th><th>Trạng thái</th><th>Ngày lập (Việt Nam)</th><th>Chi tiết</th></tr></thead><tbody><tr th:each="o:${orders}"><td><strong th:text="${o.OrderCode}"></strong></td><td th:text="${o.RecipientName} + ' · ' + ${o.RecipientPhone}"></td><td th:text="${o.Channel}"></td><td><span class="status" th:text="${o.Status}"></span></td><td th:text="${o.OrderedLocal}"></td><td><a th:href="@{/admin/orders/{id}(id=${o.OrderID})}">Xử lý đơn</a></td></tr><tr th:if="${#lists.isEmpty(orders)}"><td colspan="6">Chưa có đơn hàng.</td></tr></tbody></table></div></section></main></body></html>
