<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TIVAREK — Đổi mật khẩu</title>
  <link rel="stylesheet" th:href="@{/css/week23.css}">
<link rel="stylesheet" th:href="@{/css/app.css}">
<link rel="stylesheet" th:href="@{/css/week24.css}">
</head>
<body><a class="w24-skip" href="#main-content">Bỏ qua điều hướng</a>
<main id="main-content" tabindex="-1" class="workspace narrow">
  <section class="panel" style="max-width:620px;margin:48px auto">
    <a class="brand" th:href="@{/}">TIVAREK<span>ĐIỆN TỬ &amp; SỬA CHỮA</span></a>
    <h1>Đổi mật khẩu</h1>
    <p class="muted">Nhập mật khẩu hiện tại để bảo vệ tài khoản. Sau khi đổi thành công, bạn sẽ cần đăng nhập lại.</p>
    <div class="notice error" role="alert" th:if="${failure}" th:text="${failure}"></div>
    <form class="stack" method="post" th:action="@{/doi-mat-khau}">
      <label for="currentPassword">Mật khẩu hiện tại</label>
      <input id="currentPassword" type="password" name="currentPassword" autocomplete="current-password" required>
      <label for="newPassword">Mật khẩu mới (ít nhất 12 ký tự, có chữ và số)</label>
      <input id="newPassword" type="password" name="newPassword" minlength="12" autocomplete="new-password" required>
      <label for="confirmPassword">Xác nhận mật khẩu mới</label>
      <input id="confirmPassword" type="password" name="confirmPassword" minlength="12" autocomplete="new-password" required>
      <button class="button" type="submit">Lưu mật khẩu mới</button>
    </form>
    <p><a th:href="@{/}">← Trở về trang chủ</a></p>
  </section>
</main>
</body>
</html>
