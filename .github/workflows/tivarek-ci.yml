name: TIVAREK - Java 21 CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and build Spring Boot JAR (H2 test profile)
        run: bash ./mvnw -B -ntp -Dspring.profiles.active=test clean verify
      - name: Publish build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tivarek-spring-boot-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7
